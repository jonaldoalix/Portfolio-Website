    <style>
      html {
        background: #0b0f14;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b0f14;
      }
    </style>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var mode = params.get("mode");
          var palette = params.get("palette");
          var palettes = ["base", "copper", "mark", "sage"];
          if (mode !== "light" && mode !== "dark") {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (palettes.indexOf(palette) === -1) {
            palette = palettes[Math.floor(Math.random() * palettes.length)];
          }
          var colors = {
            dark: { base: "#0b0f14", copper: "#100e0c", mark: "#080c16", sage: "#0c0f0d" },
            light: { base: "#ebe7e0", copper: "#efe6db", mark: "#e8eaf0", sage: "#e7ebe6" },
          };
          var root = document.documentElement;
          root.dataset.mode = mode;
          root.dataset.palette = palette;
          root.style.colorScheme = mode;
          root.style.background = colors[mode][palette];
          document.querySelector('meta[name="theme-color"]').content =
            colors[mode][palette];
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
